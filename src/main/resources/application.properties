spring.application.name=watches_final
app.frontend-url=http://localhost:5173

server.port=9002

spring.datasource.url=jdbc:mysql://localhost:3306/watches_final
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=smtp-mail.outlook.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp-mail.outlook.com

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.success-url=${app.frontend-url}/order/success
stripe.cancel-url=${app.frontend-url}/order/cancel
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

secret=${JWT_SECRET}
