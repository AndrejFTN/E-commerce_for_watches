spring.application.name=watches_final
app.frontend-url=http://localhost:5173

server.port=9002

spring.datasource.url=jdbc:mysql://localhost:3306/watches_final
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.success-url=${app.frontend-url}/order/success
stripe.cancel-url=${app.frontend-url}/order/cancel
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

logging.level.root=INFO
logging.level.com.invictus.watches_final=DEBUG
logging.file.name=logs/watches.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{28} - %msg%n

secret=${JWT_SECRET}
